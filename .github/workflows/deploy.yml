name: Deploy

on:
  push:
    branches: [main]

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-import:
    needs: [test-go, test-frontend]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t "pet-messenger-api:${{ github.sha }}" -f deploy/media/Dockerfile.api .
          docker build -t "pet-messenger-media:${{ github.sha }}" -f deploy/media/Dockerfile.media .
          docker build -t "pet-messenger-migrate:${{ github.sha }}" -f deploy/kubernetes/Dockerfile.migrate .
          docker build -t "pet-messenger-frontend:${{ github.sha }}" -f frontend/Dockerfile frontend
      - name: Import images into k3s's own containerd
        # k3s runs its own embedded containerd (/run/k3s/containerd/containerd.sock),
        # entirely separate from the host dockerd's containerd
        # (/run/containerd/containerd.sock) that `docker build` just populated.
        # There is no registry in this setup for kubelet to pull from, so the
        # image has to be handed to k3s's own image store directly.
        run: |
          for name in api media migrate frontend; do
            docker save "pet-messenger-$name:${{ github.sha }}" | sudo k3s ctr images import -
          done

  deploy:
    needs: build-and-import
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime secrets
        # Creates or updates pet-messenger-secrets from the repository's own
        # GitHub Actions secrets on every deploy: rotating one of these
        # secrets and pushing takes effect on the next deploy automatically,
        # no manual kubectl needed. --dry-run=client -o yaml | apply makes
        # this an upsert: safe whether the Secret already exists or not.
        env:
          JWT_ED25519_SEED_BASE64: ${{ secrets.JWT_ED25519_SEED_BASE64 }}
          BLUEPRINT_DB_PASSWORD: ${{ secrets.BLUEPRINT_DB_PASSWORD }}
          MEDIA_RPC_TOKEN: ${{ secrets.MEDIA_RPC_TOKEN }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          for v in JWT_ED25519_SEED_BASE64 BLUEPRINT_DB_PASSWORD MEDIA_RPC_TOKEN TURN_SECRET MINIO_ACCESS_KEY MINIO_SECRET_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::repository secret $v is not set (Settings -> Secrets and variables -> Actions)"
              exit 1
            fi
          done
          kubectl create namespace pet-messenger --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n pet-messenger create secret generic pet-messenger-secrets \
            --from-literal=JWT_ED25519_SEED_BASE64="$JWT_ED25519_SEED_BASE64" \
            --from-literal=BLUEPRINT_DB_PASSWORD="$BLUEPRINT_DB_PASSWORD" \
            --from-literal=MEDIA_RPC_TOKEN="$MEDIA_RPC_TOKEN" \
            --from-literal=TURN_SECRET="$TURN_SECRET" \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_ACCESS_KEY" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Point the production overlay at the new image tags and TURN secret
        env:
          SHA: ${{ github.sha }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
        run: |
          OVERLAY=deploy/kubernetes/overlays/production/kustomization.yaml
          sed -i -E "s/newTag: \"?[A-Za-z0-9._-]+\"?/newTag: \"${SHA}\"/g" "$OVERLAY"
          sed -i "s/__TURN_SECRET__/${TURN_SECRET}/" "$OVERLAY"
      - name: Re-run migrations
        run: kubectl delete job -n pet-messenger migrate --ignore-not-found
      - name: Apply
        run: kubectl apply -k deploy/kubernetes/overlays/production
      - name: Wait for rollout
        run: |
          kubectl -n pet-messenger wait --for=condition=complete job/migrate --timeout=120s
          kubectl -n pet-messenger rollout status deployment/api
          kubectl -n pet-messenger rollout status deployment/media
          kubectl -n pet-messenger rollout status deployment/frontend
