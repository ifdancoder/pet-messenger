apiVersion: v1
kind: ConfigMap
metadata:
  name: pet-messenger-config
data:
  PORT: "8080"
  BLUEPRINT_DB_HOST: postgres
  BLUEPRINT_DB_PORT: "5432"
  BLUEPRINT_DB_DATABASE: app
  BLUEPRINT_DB_USERNAME: app
  BLUEPRINT_DB_SCHEMA: public
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  MEDIA_GRPC_ADDR: media:9090
  MEDIA_WS_ADDR: localhost:8081
  MEDIA_NODE_ID: media-1
  MEDIA_RPC_TOKEN: devtoken
  TURN_URL: turn:127.0.0.1:3478
  TURN_SECRET: devsecret
  STUN_URLS: stun:127.0.0.1:3478
  CORS_ALLOWED_ORIGINS: http://localhost:5173
