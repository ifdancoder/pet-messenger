apiVersion: v1
kind: ConfigMap
metadata: {name: coturn-config}
data:
  turnserver.conf: |
    listening-port=3478
    fingerprint
    use-auth-secret
    # Must equal pet-messenger-secrets' TURN_SECRET exactly (coturn's TURN
    # REST API shared secret, used to validate the HMAC the api/media
    # pods compute). devsecret is fine for minikube; edit this to match
    # the real TURN_SECRET before applying to production (see
    # docs/deploy-guide.md step 6).
    static-auth-secret=devsecret
    realm=media.local
    no-tls
    no-dtls
    min-port=49160
    max-port=49200
    log-file=stdout
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: coturn}
spec:
  selector: {matchLabels: {app: coturn}}
  template:
    metadata: {labels: {app: coturn}}
    spec:
      hostNetwork: true
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          args: [-c, /etc/coturn/turnserver.conf]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
          volumeMounts: [{name: config, mountPath: /etc/coturn}]
      volumes: [{name: config, configMap: {name: coturn-config}}]
