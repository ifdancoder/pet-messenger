apiVersion: v1
kind: Service
metadata: {name: media}
spec:
  selector: {app: media}
  ports:
    - {name: ws, port: 8082, targetPort: 8082}
    - {name: grpc, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: media}
spec:
  replicas: 1
  selector: {matchLabels: {app: media}}
  template:
    metadata: {labels: {app: media}}
    spec:
      imagePullSecrets: [{name: registry-credentials}]
      containers:
        - name: media
          image: registry.invalid/pet-messenger-media:unset
          imagePullPolicy: Always
          env:
            - {name: PORT, value: "8082"}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: MEDIA_GRPC_ADDR, value: "$(POD_IP):9090"}
          envFrom: [{configMapRef: {name: pet-messenger-config}}, {secretRef: {name: pet-messenger-secrets}}]
          ports: [{name: ws, containerPort: 8082}, {name: grpc, containerPort: 9090}]
          resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
          readinessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 3}
