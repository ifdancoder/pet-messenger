apiVersion: batch/v1
kind: Job
metadata: {name: migrate}
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets: [{name: registry-credentials}]
      containers:
        - name: migrate
          image: registry.invalid/pet-messenger-migrate:unset
          imagePullPolicy: Always
          envFrom: [{configMapRef: {name: pet-messenger-config}}, {secretRef: {name: pet-messenger-secrets}}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 250m, memory: 96Mi}}
