apiVersion: batch/v1
kind: Job
metadata: {name: migrate}
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets: [{name: registry-credentials}]
      containers:
        - name: migrate
          image: 130.17.20.23:5000/pet-messenger-migrate:ea74cd9
          imagePullPolicy: Always
          envFrom: [{configMapRef: {name: pet-messenger-config}}, {secretRef: {name: pet-messenger-secrets}}]
