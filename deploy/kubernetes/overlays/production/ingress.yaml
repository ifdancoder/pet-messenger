apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pet-messenger
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [messenger.ifdancoder.ru]
      secretName: pet-messenger-tls
  rules:
    - host: messenger.ifdancoder.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 80}}
