namespace: pet-messenger
resources:
  - ../../base
  - ingress.yaml

# newTag here is a placeholder: the "deploy" job in
# .github/workflows/deploy.yml rewrites it to the commit SHA on every push
# to main. Never edit it by hand; a stable tag would make repeated applies
# of the same manifest a no-op, exactly like overlays/minikube's
# kustomization documents for the same reason.
#
# newName strips the registry host entirely: this node has no registry to
# push to or pull from. "deploy" imports each image straight into k3s's own
# containerd (k3s ctr images import) right after building it, and the
# imagePullPolicy patch below is what makes kubelet use that local image
# instead of trying to pull one.
images:
  - {name: registry.invalid/pet-messenger-api, newName: pet-messenger-api, newTag: unset}
  - {name: registry.invalid/pet-messenger-media, newName: pet-messenger-media, newTag: unset}
  - {name: registry.invalid/pet-messenger-frontend, newName: pet-messenger-frontend, newTag: unset}
  - {name: registry.invalid/pet-messenger-migrate, newName: pet-messenger-migrate, newTag: unset}

patches:
  # base/{api,media,migrate,frontend}.yaml all set imagePullPolicy: Always,
  # correct for a real registry but fatal here: there's nothing to pull
  # from, so kubelet needs to use the image k3s ctr images import already
  # placed in its local store instead. Same patch overlays/minikube already
  # applies, for the identical reason.
  - target: {kind: Deployment}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: {kind: Job}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # base/config.yaml's TURN_URL/STUN_URLS default to 127.0.0.1, which is what
  # Minikube's overlay needs (coturn on the same node). Production's coturn
  # is reachable at a real DNS name instead; point only this overlay at it so
  # Minikube's own TURN testing keeps working unchanged.
  #
  # MEDIA_WS_ADDR/MEDIA_WS_SCHEME/CORS_ALLOWED_ORIGINS default (base/config.yaml)
  # to localhost, correct only for Minikube's port-forward workflow. In
  # production the browser never reaches the media pod's port directly --
  # frontend/nginx.conf proxies /rtc to it over the same origin the frontend
  # itself is served on -- so the address the browser must use is the public
  # hostname, over TLS, with no port. Getting this wrong doesn't surface as a
  # clean error: the browser just can't open the /rtc and /api/ws sockets at
  # all (silent connection failures), and a call nobody could actually join
  # only ever shows as "live" until its own empty-room idle timeout ends it.
  - target: {kind: ConfigMap, name: pet-messenger-config}
    patch: |-
      - op: replace
        path: /data/TURN_URL
        value: turn:turn.messenger.ifdancoder.ru:3478
      - op: replace
        path: /data/STUN_URLS
        value: stun:stun.messenger.ifdancoder.ru:3478
      - op: replace
        path: /data/MEDIA_WS_ADDR
        value: messenger.ifdancoder.ru
      - op: replace
        path: /data/MEDIA_WS_SCHEME
        value: wss
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: https://messenger.ifdancoder.ru
  # __TURN_SECRET__ is a placeholder: deploy.yml substitutes it with the
  # real value from the TURN_SECRET GitHub Actions secret right before
  # applying, the same one pet-messenger-secrets gets built from, so coturn
  # and the api/media pods can never end up checking different secrets.
  # base/coturn.yaml's own devsecret literal stays untouched for Minikube.
  - target: {kind: ConfigMap, name: coturn-config}
    patch: |-
      - op: replace
        path: /data/turnserver.conf
        value: |
          listening-port=3478
          fingerprint
          use-auth-secret
          static-auth-secret=__TURN_SECRET__
          realm=media.local
          no-tls
          no-dtls
          min-port=49160
          max-port=49200
          log-file=stdout
