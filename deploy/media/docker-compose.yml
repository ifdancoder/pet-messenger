name: pet-messenger-media

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  nats:
    image: nats:2.10
    command: ["-js"]
    ports: ["4222:4222"]
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
  media:
    build: { context: ../.., dockerfile: deploy/media/Dockerfile.media }
    environment:
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_ED25519_SEED_BASE64: ${JWT_ED25519_SEED_BASE64}
      MEDIA_NODE_ID: media-1
      MEDIA_GRPC_ADDR: media:9090
      # Advertised to the browser; the service itself binds only to this port.
      MEDIA_WS_ADDR: localhost:8081
      MEDIA_RPC_TOKEN: devtoken
      PORT: "0"
    depends_on: [redis, nats]
    ports: ["8081:8081", "9090:9090"]
  api:
    build: { context: ../.., dockerfile: deploy/media/Dockerfile.api }
    environment:
      PORT: "8080"
      BLUEPRINT_DB_HOST: postgres
      BLUEPRINT_DB_PORT: "5432"
      BLUEPRINT_DB_DATABASE: app
      BLUEPRINT_DB_USERNAME: app
      BLUEPRINT_DB_PASSWORD: app
      BLUEPRINT_DB_SCHEMA: public
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_ED25519_SEED_BASE64: ${JWT_ED25519_SEED_BASE64}
      MEDIA_RPC_TOKEN: devtoken
      TURN_URL: turn:127.0.0.1:3478
      TURN_SECRET: devsecret
      STUN_URLS: stun:127.0.0.1:3478
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      media:
        condition: service_started
    ports: ["8080:8080"]
