server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /rtc {
    proxy_pass http://media:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # This WebSocket carries call signaling for the connection's entire
    # lifetime, not just its setup — nginx's 60s default proxy_read_timeout
    # (and proxy_send_timeout) closes it the moment 60s pass without a byte
    # in either direction, which happens routinely: once ICE candidates are
    # done trickling there's often a long quiet stretch before the next
    # signaling message, and actual media never touches this channel at all
    # (it flows over the separate WebRTC data path). nginx tearing this down
    # mid-negotiation is what was surfacing as "sfu: send ...: broken pipe"
    # in the media pod's logs, killing otherwise-recoverable calls.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Vite fingerprints every filename under assets/ with a content hash, so a
  # given path's bytes never change — safe to cache indefinitely. index.html
  # is what points at the current hash, so it must never be cached: an old
  # cached copy references assets/ files a later deploy has already deleted.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
